      '<div class="hs-hero">' +
      '<h1>🪑 11/16 Hot Seat 熱座</h1>' +
      '<p style="margin:0 0 8px">一人坐在「熱座」<b>背對螢幕</b>。其他人看大字，用日語提示，但不能直接說出目標詞。猜對就按「猜對了」，想不到就「跳過」。</p>' +
      '<p style="margin:0;color:#5b6370">今天共 <b>' + CARDS.length + ' 張卡片</b>：時、もうすぐ、くれます／あげます／もらいます，再加一點て形。每張下面有 2–3 句可用的日語提示。</p>' +
      '</div>' +
      '<div class="box"><h3 style="margin-top:0">每張限制時間</h3>' +
      '<div class="hs-times" id="times"></div></div>' +
      '<button class="hs-btn go" id="go">開始遊戲</button>';
    var times = document.getElementById('times');
    [30, 45, 60, 90, 120].forEach(function (n) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = n + ' 秒';
      if (n === sec) b.className = 'on';
      b.onclick = function () {
        sec = n;
        Array.prototype.forEach.call(times.querySelectorAll('button'), function (x) { x.className = ''; });
        b.className = 'on';
      };
      times.appendChild(b);
    });
    document.getElementById('go').onclick = function () { begin(); };
  }

  function begin() {
    state = { items: shuffle(CARDS), i: 0, ok: 0, skip: 0, log: [], left: sec, frozen: false };
    showCard();
  }

  function showCard() {
    clearInterval(timer);
    if (state.i >= state.items.length) return endScreen();
    var c = state.items[state.i];
    state.left = sec;
    state.frozen = false;
    state._lock = false;
    app.innerHTML =
      '<div class="hs-barline">' +
      '<span class="hs-chip">第 ' + (state.i + 1) + ' / ' + state.items.length + ' 張</span>' +
      '<span class="hs-chip">✅ ' + state.ok + '　⏭ ' + state.skip + '</span>' +
      '<span class="hs-chip clock-num" id="clock">' + sec + '</span>' +
      '</div>' +
      '<div class="hs-timer" id="bar"><i id="barI"></i></div>' +
      '<div class="hs-card">' +
      '<div class="cat">' + esc(c.cat) + '</div>' +
      '<div class="ja" lang="ja">' + esc(c.ja) + '</div>' +
      '<div class="kana" lang="ja">' + esc(c.kana) + '</div>' +
      '<div class="ro">' + esc(c.ro) + '</div>' +
      '<div class="zh">' + esc(c.zh) + '</div>' +
      '</div>' +
      '<div class="hs-hints"><h3>其他人可以這樣提示（請大聲唸）</h3>' +
      c.hints.map(function (h, i) {
        return '<div class="hs-h"><button class="play" type="button" data-i="' + i + '" aria-label="播放">▶</button>' +
          '<div class="tx"><div class="ja" lang="ja">' + esc(h.ja) + '</div><div class="ro">' + esc(h.ro) + '</div><div class="zh">' + esc(h.zh) + '</div></div></div>';
      }).join('') +
      '</div>' +
      '<div class="hs-acts">' +
      '<button class="hs-btn ok" id="yes">✅ 猜對了</button>' +
      '<button class="hs-btn skip" id="no">⏭ 跳過</button>' +
      '</div>' +
      '<p class="lead" style="text-align:center">提示的人不要直接把大字唸出來。熱座上的人背對螢幕。</p>';
    Array.prototype.forEach.call(app.querySelectorAll('.play'), function (b) {
      b.onclick = function () { sayJa(c.hints[+b.getAttribute('data-i')].say); };
    });
    document.getElementById('yes').onclick = function () { settle(true); };
    document.getElementById('no').onclick = function () { settle(false); };
    tick();
  }

  function tick() {
    var bar = document.getElementById('bar');
    var barI = document.getElementById('barI');
    var clock = document.getElementById('clock');
    var last = Date.now();
    function paint() {
      if (barI) barI.style.width = (state.left / sec * 100) + '%';
      if (bar) bar.className = 'hs-timer' + (state.left <= 8 ? ' hot' : state.left <= 20 ? ' warn' : '');
      if (clock) clock.textContent = Math.ceil(Math.max(0, state.left));
    }
    paint();
    timer = setInterval(function () {
      if (state.frozen) { clearInterval(timer); return; }
      var now = Date.now();
      state.left -= (now - last) / 1000;
      last = now;
      if (state.left <= 0) {
        state.left = 0;
        paint();
        clearInterval(timer);
        state.frozen = true;
        var acts = app.querySelector('.hs-acts');
        var note = document.createElement('div');
        note.className = 'warn';
        note.innerHTML = '<b>時間到！</b> 如果剛好猜出來，還可以按「猜對了」；否則按「跳過」。';
        acts.parentNode.insertBefore(note, acts);
        return;
      }
      paint();
    }, 80);
  }

  function settle(ok) {
    if (state._lock) return;
    state._lock = true;
    state.frozen = true;
    clearInterval(timer);
    var c = state.items[state.i];
    if (ok) state.ok += 1; else state.skip += 1;
    state.log.push({ c: c, ok: ok });
    sayJa(c.say);
    state.i += 1;
    showCard();
  }

  function endScreen() {
    clearInterval(timer);
    app.innerHTML =
      '<div class="hs-end">' +
      '<p>本輪結束</p>' +
      '<div class="big">' + state.ok + ' / ' + state.items.length + '</div>' +
      '<p>猜對 ' + state.ok + '　·　跳過 ' + state.skip + '</p>' +
      '</div>' +
      '<h2>卡片回顧</h2><div class="hs-review">' +
      state.log.map(function (x, i) {
        return '<div class="item ' + (x.ok ? 'got' : 'miss') + '"><b>' + (i + 1) + '. <span lang="ja">' + esc(x.c.ja) + '</span></b>　' +
          (x.ok ? '✅ 猜對' : '⏭ 跳過') +
          '<div class="kana" lang="ja">' + esc(x.c.kana) + '　<span class="ro">' + esc(x.c.ro) + '</span></div>' +
          '<div>' + esc(x.c.zh) + '</div></div>';
      }).join('') +
      '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0">' +
      '<button class="hs-btn go" id="again" style="width:auto;padding:12px 18px">再玩一次</button>' +
      '<a class="hs-btn alt" href="2026-11-16-kahoot.html" style="text-decoration:none;display:inline-block;padding:12px 18px">去玩 Kahoot</a>' +
      '<a class="hs-btn alt" href="2026-11-16.html" style="text-decoration:none;display:inline-block;padding:12px 18px">回課堂頁</a>' +
      '</div>';
    document.getElementById('again').onclick = function () { startScreen(); };
  }

  startScreen();
})();
</script>
</body>
</html>
