    return '💪 再練一次會更好';
  }

  function startScreen() {
    app.innerHTML =
      '<div class="kh-hero">' +
      '<h1>🎯 11/16 Kahoot</h1>' +
      '<p style="margin:0 0 8px">漢字「時」、もうすぐ、くれます／あげます／もらいます，再加兩題て形。共 <b>' + Q.length + ' 題</b>，每題 20 秒，答得越快分越高，連對有加分。</p>' +
      '<p style="margin:0;color:#5b6370">有聽力題，請打開聲音。答完會看到假名、羅馬拼音、中文，文法再附英文。</p>' +
      '</div>' +
      '<div class="tip"><b>怎麼玩：</b>先按「開始」。四個大色塊選答案。時間到或按錯都會中斷連對。同一瀏覽器會記下最高分排行。</div>' +
      '<div class="kh-actions"><button class="kh-btn hot" id="go">開始測驗</button>' +
      '<a class="kh-btn alt" href="2026-11-16-hotseat.html" style="text-decoration:none;display:inline-block">改玩 Hot Seat</a></div>' +
      renderBoard(null);
    document.getElementById('go').onclick = function () { begin(); };
  }

  function renderBoard(mine) {
    var rows = loadBoard().slice().sort(function (a, b) { return b.score - a.score; });
    if (mine) {
      var shown = false;
      rows = rows.map(function (r) {
        if (!shown && r.t === mine.t && r.score === mine.score) { shown = true; return Object.assign({ me: true }, r); }
        return r;
      });
    }
    if (!rows.length && !mine) return '<p class="lead">還沒有本地紀錄，來拿第一名吧！</p>';
    var html = '<h2 id="board" data-short="排行">本機排行榜</h2><table class="kh-board"><thead><tr><th>#</th><th>分數</th><th>答對</th><th>連對</th><th>時間（東京）</th></tr></thead><tbody>';
    rows.forEach(function (r, i) {
      html += '<tr' + (r.me ? ' class="me"' : '') + '><td>' + (i + 1) + '</td><td>' + r.score + '</td><td>' + r.correct + '/' + r.total + '</td><td>' + r.maxStreak + '</td><td>' + esc(r.when) + (r.me ? '　← 本次' : '') + '</td></tr>';
    });
    html += '</tbody></table><p class="lead" style="font-size:.85rem">只存在這個瀏覽器，不會上傳，也不會出現名字。</p>';
    return html;
  }

  function begin() {
    state = {
      items: shuffle(Q),
      i: 0,
      score: 0,
      correct: 0,
      streak: 0,
      maxStreak: 0,
      log: [],
      left: TIME,
      timer: null,
      answered: false,
      startLeft: TIME
    };
    showQ();
  }

  function showQ() {
    var it = state.items[state.i];
    var opts = shuffle(it.o).map(function (text, idx) {
      return { text: text, color: SHAPES[idx] };
    });
    state.answered = false;
    state.left = TIME;
    state.startLeft = TIME;
    app.innerHTML =
      '<div class="kh-stats">' +
      '<span class="kh-chip">第 <span class="n">' + (state.i + 1) + '</span> / ' + state.items.length + ' 題</span>' +
      '<span class="kh-chip">🔥 連對 <span class="n">' + state.streak + '</span></span>' +
      '<span class="kh-chip">分數 <span class="n">' + state.score + '</span></span>' +
      '<span class="kh-chip" id="clock">⏱ ' + TIME + ' 秒</span>' +
      '</div>' +
      '<div class="kh-timer" id="bar"><i id="barI"></i></div>' +
      '<div class="kh-q"><div class="tag">' + esc(it.tag) + (it.listen ? '　🎧 聽力題' : '') + '</div>' +
      '<div class="qt">' + it.q + '</div>' +
      (it.say ? '<button class="kh-play" type="button" id="listen">🔊 播放題目</button>' : '') +
      '</div>' +
      '<div class="kh-grid" id="opts"></div>' +
      '<div id="fb"></div>';
    var box = document.getElementById('opts');
    opts.forEach(function (op) {
      var b = document.createElement('button');
      b.className = 'kh-opt ' + op.color.cls;
      b.setAttribute('data-answer', op.text);
      b.innerHTML = '<span class="shape">' + op.color.shape + '</span>' + esc(op.text);
      b.onclick = function () { lock(op.text, box); };
      box.appendChild(b);
    });
    var play = document.getElementById('listen');
    if (play) {
      play.onclick = function () { sayJa(it.say); };
      setTimeout(function () { sayJa(it.say); }, 280);
    }
    tick();
  }

  function tick() {
    clearInterval(state.timer);
    var bar = document.getElementById('bar');
    var barI = document.getElementById('barI');
    var clock = document.getElementById('clock');
    function paint() {
      if (barI) barI.style.width = (state.left / TIME * 100) + '%';
      if (bar) {
        bar.className = 'kh-timer' + (state.left <= 5 ? ' hot' : state.left <= 10 ? ' warn' : '');
      }
      if (clock) clock.textContent = '⏱ ' + Math.ceil(state.left) + ' 秒';
    }
    paint();
    var last = Date.now();
    state.timer = setInterval(function () {
      if (state.answered) { clearInterval(state.timer); return; }
      var now = Date.now();
      state.left -= (now - last) / 1000;
      last = now;
      if (state.left <= 0) {
        state.left = 0;
        paint();
        clearInterval(state.timer);
        lock(null, document.getElementById('opts'));
        return;
      }
      paint();
    }, 80);
  }

  function lock(choice, box) {
    if (state.answered) return;
    state.answered = true;
    clearInterval(state.timer);
    var it = state.items[state.i];
    var ok = choice === it.a;
    var pts = 0, bonus = 0;
    if (ok) {
      pts = pointsFor(state.left, TIME);
      state.streak += 1;
      if (state.streak > state.maxStreak) state.maxStreak = state.streak;
      bonus = streakBonus(state.streak);
      state.score += pts + bonus;
      state.correct += 1;
    } else {
      state.streak = 0;
    }
    state.log.push({ it: it, mine: choice, ok: ok, pts: pts + bonus });
    Array.prototype.forEach.call(box.querySelectorAll('.kh-opt'), function (b) {
      b.disabled = true;
      var label = b.getAttribute('data-answer');
      if (label === it.a) b.classList.add('pick-ok');
      else if (choice && label === choice) b.classList.add('pick-bad');
      else b.classList.add('dim');
    });
    var fb = document.getElementById('fb');
    var timeout = choice == null;
    fb.innerHTML =
      '<div class="kh-fb ' + (ok ? 'ok' : 'bad') + '">' +
      '<div class="result">' + (ok ? '✅ 答對了！' : timeout ? '⏰ 時間到了' : '❌ 再記一下') + '</div>' +
      (ok
        ? '<div class="pts">＋' + pts + ' 分' + (bonus ? '　連對加分 ＋' + bonus : '') + '　目前 ' + state.score + ' 分</div>'
        : '<div class="pts">正確答案：<b>' + esc(it.a) + '</b>　連對中斷，分數 ' + state.score + '</div>') +
      '<div class="kh-ex">' + it.ex + '</div>' +
      '<div class="kh-actions">' +
      '<button class="kh-btn hot" id="next">' + (state.i + 1 >= state.items.length ? '看結果' : '下一題 →') + '</button>' +
      (it.sa || it.say ? '<button class="kh-btn alt" id="replay">🔊 再聽一次</button>' : '') +
      '</div></div>';
    document.getElementById('next').onclick = function () {
      state.i += 1;
      if (state.i >= state.items.length) endScreen();
      else showQ();
    };
    var rp = document.getElementById('replay');
    if (rp) rp.onclick = function () { sayJa(it.sa || it.say); };
    if (ok && (it.sa || it.say)) setTimeout(function () { sayJa(it.sa || it.say); }, 250);
  }

  function tokyoWhen() {
    var d = new Date();
    var s = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(d);
    return s + '（東京時間）';
  }

  function endScreen() {
    var rec = {
      score: state.score,
      correct: state.correct,
      total: state.items.length,
      maxStreak: state.maxStreak,
      when: tokyoWhen(),
      t: Date.now()
    };
    var board = loadBoard();
    board.push(rec);
    board.sort(function (a, b) { return b.score - a.score; });
    saveBoard(board);
    var wrong = state.log.filter(function (x) { return !x.ok; });
    app.innerHTML =
      '<div class="kh-end">' +
      '<div class="rank">' + rankOf(state.score, state.items.length) + '</div>' +
      '<div class="score">' + state.score + '</div>' +
      '<p>分</p>' +
      '<div class="kh-podium">' +
      '<div class="p p2"><b>' + (board[1] ? board[1].score : '—') + '</b><span>第 2</span></div>' +
      '<div class="p p1"><b>' + (board[0] ? board[0].score : rec.score) + '</b><span>第 1</span></div>' +
      '<div class="p p3"><b>' + (board[2] ? board[2].score : '—') + '</b><span>第 3</span></div>' +
      '</div>' +
      '<p>答對 <b>' + state.correct + ' / ' + state.items.length + '</b>　·　最高連對 <b>' + state.maxStreak + '</b></p>' +
      '</div>' +
      renderBoard(rec) +
      (wrong.length
        ? '<h2>錯題回顧</h2>' + wrong.map(function (w, i) {
            return '<div class="box"><b>' + (i + 1) + '. ' + w.it.q + '</b><p>你的答案：<span class="red">' + esc(w.mine || '（沒作答）') + '</span><br>正確：<b style="color:var(--ok)">' + esc(w.it.a) + '</b></p><div class="kh-ex">' + w.it.ex + '</div></div>';
          }).join('')
        : '<p class="tip">全部答對，太厲害了！</p>') +
      '<div class="kh-actions" style="justify-content:center">' +
      '<button class="kh-btn hot" id="again">再玩一次</button>' +
      '<a class="kh-btn alt" href="2026-11-16-hotseat.html" style="text-decoration:none">去玩 Hot Seat</a>' +
      '<a class="kh-btn alt" href="2026-11-16.html" style="text-decoration:none">回課堂頁</a>' +
      '</div>';
    document.getElementById('again').onclick = function () { begin(); };
  }

  startScreen();
})();
</script>
</body>
</html>
